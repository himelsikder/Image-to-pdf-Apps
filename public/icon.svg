<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Image Card Gradient -->
    <linearGradient id="img-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- PDF Card Gradient -->
    <linearGradient id="pdf-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- PDF Badge Gradient -->
    <linearGradient id="pdf-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="shadow-main" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle (Play Store 512x512 spec) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="url(#border-glow)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Ambient background glow circles -->
  <circle cx="160" cy="180" r="120" fill="#38bdf8" fill-opacity="0.12" filter="blur(40px)" />
  <circle cx="350" cy="320" r="120" fill="#ef4444" fill-opacity="0.1" filter="blur(40px)" />

  <!-- LEFT CARD: IMAGE (IMG) -->
  <g filter="url(#shadow-main)" transform="translate(68, 120)">
    <!-- Image Card Body -->
    <rect width="180" height="240" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Photo viewport inner -->
    <rect x="14" y="14" width="152" height="150" rx="14" fill="#07273c" />
    
    <!-- Sun -->
    <circle cx="125" cy="52" r="16" fill="#fde047" />
    
    <!-- Mountain Background -->
    <path d="M14 140 L58 84 L96 130 L128 98 L166 148 L166 164 L14 164 Z" fill="#0284c7" />
    <!-- Mountain Foreground -->
    <path d="M14 164 L40 125 L75 164 Z" fill="#38bdf8" fill-opacity="0.7" />
    <path d="M70 164 L108 116 L144 164 Z" fill="#0ea5e9" />
    <path d="M120 164 L148 132 L166 154 L166 164 Z" fill="#38bdf8" />

    <!-- "IMG" Bottom Label Badge -->
    <g filter="url(#badge-shadow)">
      <rect x="14" y="180" width="80" height="38" rx="10" fill="#0284c7" />
      <text x="54" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">IMG</text>
    </g>

    <!-- Small photo indicator dots -->
    <circle cx="120" cy="199" r="4" fill="#7dd3fc" />
    <circle cx="135" cy="199" r="4" fill="#7dd3fc" />
    <circle cx="150" cy="199" r="4" fill="#7dd3fc" />
  </g>

  <!-- RIGHT CARD: PDF DOCUMENT -->
  <g filter="url(#shadow-main)" transform="translate(264, 152)">
    <!-- Document Body -->
    <rect width="180" height="240" rx="22" fill="url(#pdf-card-grad)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Folded top-right corner -->
    <path d="M136 0 L180 44 L136 44 Z" fill="#94a3b8" />
    <path d="M136 0 L136 44 L180 44" fill="none" stroke="#64748b" stroke-width="1.5" />

    <!-- Document simulated text lines -->
    <rect x="22" y="60" width="100" height="10" rx="5" fill="#64748b" fill-opacity="0.5" />
    <rect x="22" y="82" width="136" height="8" rx="4" fill="#94a3b8" fill-opacity="0.4" />
    <rect x="22" y="100" width="124" height="8" rx="4" fill="#94a3b8" fill-opacity="0.4" />
    <rect x="22" y="118" width="136" height="8" rx="4" fill="#94a3b8" fill-opacity="0.4" />

    <!-- Mini chart/diagram in PDF -->
    <rect x="22" y="138" width="136" height="26" rx="6" fill="#e2e8f0" />
    <rect x="28" y="144" width="36" height="14" rx="3" fill="#ef4444" fill-opacity="0.3" />
    <rect x="70" y="144" width="50" height="14" rx="3" fill="#3b82f6" fill-opacity="0.25" />

    <!-- "PDF" Badge -->
    <g filter="url(#badge-shadow)">
      <rect x="22" y="180" width="80" height="38" rx="10" fill="url(#pdf-badge-grad)" />
      <text x="62" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
    </g>

    <!-- Verified checkmark / lock icon inside PDF badge area -->
    <circle cx="136" cy="199" r="14" fill="#dcfce7" />
    <path d="M130 199 L134 203 L142 195" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CENTER CONVERSION BADGE / ARROW -->
  <g filter="url(#shadow-main)" transform="translate(256, 230)">
    <!-- Center circular container -->
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="url(#border-glow)" stroke-width="3.5" />
    
    <!-- Bold '2' or Conversion Arrow -->
    <path d="M -16 -6 L 8 -6 M 0 -14 L 8 -6 L 0 2" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 16 8 L -8 8 M 0 0 L -8 8 L 0 16" fill="none" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Ribbon text: "OFFLINE CONVERTER" -->
  <g transform="translate(256, 74)">
    <rect x="-92" y="-15" width="184" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="-70" cy="0" r="4.5" fill="#10b981" />
    <text x="4" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">100% OFFLINE</text>
  </g>

  <!-- Bottom App Name Label -->
  <g transform="translate(256, 452)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="2">IMG ➔ PDF</text>
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="3">DOCMORPH</text>
  </g>
</svg>
